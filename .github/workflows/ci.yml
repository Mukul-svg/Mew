name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-and-translations:
    name: Host tests and translations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check every translated string
        run: python3 scripts/check-translations.py

      - name: Test the translation checker itself
        run: python3 scripts/test_check_translations.py

      - name: Test the Mew Host
        run: node --test host/test/host.test.mjs

  android:
    name: Android debug build and unit tests
    # Pin the image: it ships Android SDK platform 37.0 and build-tools 37.0.0. The old
    # android-actions/setup-android@v3 step is gone because it failed on the preinstalled
    # cmdline-tools and then stopped at an interactive licence prompt.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check the Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ ! -d "$SDK_ROOT/platforms/android-37.0" ] || [ ! -d "$SDK_ROOT/build-tools/37.0.0" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            test -x "$SDKM" || { echo "::error::No Android SDK at $SDK_ROOT"; exit 1; }
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            "$SDKM" --install "platforms;android-37.0" "build-tools;37.0.0"
          fi
          test -d "$SDK_ROOT/platforms/android-37.0"
          test -d "$SDK_ROOT/build-tools/37.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the phone app
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Run the phone unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Keep the test report when something fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14
